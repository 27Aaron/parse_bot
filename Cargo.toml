[workspace]
resolver = "2"
members = [
    "crates/parse-core",
    "apps/parse-bot",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
base64 = "0.22"
chrono = "0.4"
dotenvy = "0.15"
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
parking_lot = "0.12"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tdlib-rs = { version = "=1.4.0", default-features = false, features = ["bots-only-api", "local-tdlib", "static"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = "symbols"
