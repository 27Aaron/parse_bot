[package]
name = "parse-bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Telegram bot delivery shell for parse-core"

[[bin]]
name = "parse-bot"
path = "src/main.rs"

[dependencies]
# Resolving/download core lives in https://github.com/27Aaron/Parse
# Pin to main while the API is early; switch to a rev/tag for production freezes.
parse-core = { git = "https://github.com/27Aaron/Parse.git", branch = "main" }
base64 = "0.22"
chrono = "0.4"
dotenvy = "0.15"
futures-util = "0.3"
libc = "0.2"
parking_lot = "0.12"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tdlib-rs = { version = "=1.4.0", default-features = false, features = ["bots-only-api", "local-tdlib", "static"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
hex = "0.4"
sha2 = "0.11"

[profile.release]
lto = "thin"
strip = "symbols"
