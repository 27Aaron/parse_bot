version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    target-branch: main
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust
    assignees:
      - 27Aaron
    groups:
      rust-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:30"
      timezone: Asia/Shanghai
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    assignees:
      - 27Aaron
